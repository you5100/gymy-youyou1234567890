<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Gymy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gymy">
<style>
:root{--head:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",system-ui,sans-serif}
[data-theme=iron]{--bg:#0b0b0c;--card:#151517;--line:#2a2a2e;--text:#f4f4f5;--muted:#8d8d95;--accent:#ff3b30;--accent2:#ff9500;--on:#fff;--done:#2a1210;--glow:0 0 0 transparent;--tex:rgba(255,255,255,.022)}
[data-theme=neon]{--bg:#0b0920;--card:#14113a;--line:#2b2670;--text:#eef0ff;--muted:#8f8bd1;--accent:#00f0ff;--accent2:#ff2bd6;--on:#02121a;--done:#0c2a3a;--glow:0 0 14px rgba(0,240,255,.65);--tex:rgba(255,255,255,.02)}
[data-theme=gold]{--bg:#0c0a07;--card:#17130b;--line:#3a2f14;--text:#fbf3dc;--muted:#a8966a;--accent:#f5c542;--accent2:#d9961a;--on:#1a1200;--done:#2a2108;--glow:0 0 0 transparent;--tex:rgba(245,197,66,.035)}
[data-theme=toxic]{--bg:#050805;--card:#0e140e;--line:#223022;--text:#eaffea;--muted:#7f9a7f;--accent:#b6ff00;--accent2:#39ff14;--on:#061200;--done:#14240a;--glow:0 0 14px rgba(182,255,0,.5);--tex:rgba(182,255,0,.03)}
[data-theme=chalk]{--bg:#f1eee6;--card:#fffdf8;--line:#d8d3c6;--text:#111;--muted:#6f6a5c;--accent:#111;--accent2:#e11d48;--on:#fff;--done:#e6e1d2;--glow:0 0 0 transparent;--tex:rgba(0,0,0,.03)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);background-image:repeating-linear-gradient(135deg,transparent 0 14px,var(--tex) 14px 28px);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
#view{max-width:640px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand b{font-family:var(--head);font-style:italic;letter-spacing:2px;font-size:15px;color:var(--accent);text-shadow:var(--glow)}
.brand span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 0 5px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.wd i{font-style:normal;font-size:11px;height:14px;color:var(--muted)}
.wd.today i{color:var(--accent2)}
.wd.complete i{color:var(--accent)}
.wd.active{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700;box-shadow:var(--glow)}
.wd.active i{color:var(--on)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 4px}
.hero .t{min-width:0}
.hero .d{font-size:13px;color:var(--muted);margin-bottom:2px}
.hero h1{margin:0;font-family:var(--head);font-style:italic;text-transform:uppercase;font-size:clamp(44px,15vw,70px);line-height:.95;color:var(--accent);text-shadow:var(--glow);letter-spacing:1px;direction:ltr;text-align:right;word-break:break-word}
.ring{flex:0 0 84px;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1%),var(--line) 0);display:grid;place-items:center;box-shadow:var(--glow)}
.ring b{width:68px;height:68px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--head);font-size:22px;direction:ltr}
.stripe{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:10px 0 8px}
.quote{font-size:13px;color:var(--muted);margin:0 2px 14px}
.note{border:1px dashed var(--accent2);color:var(--accent2);border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.section{font-family:var(--head);font-size:14px;letter-spacing:1px;color:var(--accent2);margin:18px 4px 8px}
.ex{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px;border-inline-start:4px solid var(--line)}
.ex.done{background:var(--done);border-color:var(--accent);border-inline-start-color:var(--accent)}
.ex.done .name{opacity:.55;text-decoration:line-through}
.num{flex:0 0 28px;font-family:var(--head);font-size:20px;color:var(--muted);direction:ltr;text-align:center}
.ex.done .num{color:var(--accent)}
.chk{flex:0 0 30px;width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;color:transparent;font-size:17px;font-weight:900;padding:0;cursor:pointer}
.ex.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on);box-shadow:var(--glow)}
.info{flex:1;min-width:0;cursor:pointer}
.name{font-weight:700;font-size:15px;unicode-bidi:plain-text;text-align:right}
.meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.tag{display:inline-block;font-size:10.5px;border:1px solid var(--accent2);color:var(--accent2);border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.w{flex:0 0 68px;width:68px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 4px;font-size:14px;text-align:center;font-family:inherit}
.w::placeholder{color:var(--muted)}
.rest{text-align:center;padding:50px 20px;color:var(--muted)}
.rest b{display:block;font-size:54px;margin-bottom:10px}
.ghost{display:block;margin:20px auto 0;background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 16px;font-size:13px;cursor:pointer}
/* ID card */
.pass{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--glow)}
.pass::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pass small{color:var(--muted);font-size:12px;letter-spacing:1px}
.pass .id{font-family:var(--head);font-style:italic;font-size:64px;line-height:1;color:var(--accent);text-shadow:var(--glow);direction:ltr;text-align:right;margin:4px 0 14px}
.bc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 10px 8px;text-align:center}
.bc svg{display:block;width:100%;height:130px}
.bc div{color:#000;font:600 22px/1.2 "Courier New",monospace;letter-spacing:6px;margin-top:6px}
.pills{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.pills button{flex:1;min-width:90px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 10px;font-size:12.5px;cursor:pointer}
.pills button.on{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.big{width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--on);cursor:pointer;box-shadow:var(--glow)}
.hint{color:var(--muted);font-size:12.5px;margin:12px 4px 0;line-height:1.7}
/* themes */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tc{border:2px solid var(--line);border-radius:16px;padding:14px 12px;text-align:right;cursor:pointer;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.tc.on{border-color:var(--accent);box-shadow:var(--glow)}
.tc .en{font-family:var(--head);font-style:italic;font-size:28px;direction:ltr;text-align:right;letter-spacing:1px}
.tc .ar{font-weight:700;font-size:14px}
.tc .ds{font-size:11.5px;opacity:.75}
.tc .bar{height:5px;border-radius:5px;margin:8px 0}
/* bottom bar */
.tabbar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar button{flex:1;background:none;border:0;padding:8px 4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabbar button span{font-size:22px;filter:grayscale(1);opacity:.7}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar button.on span{filter:none;opacity:1}
/* scan overlay */
.scan{position:fixed;inset:0;background:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#000}
.scan.show{display:flex}
.scan svg{width:96vw;max-width:900px;height:42vh}
.scan .n{font:700 clamp(30px,9vw,56px)/1.2 "Courier New",monospace;letter-spacing:10px;margin-top:10px}
.scan p{color:#555;font-size:14px;margin-top:22px}

[data-theme=ocean]{--bg:#06121f;--card:#0c1d30;--line:#173452;--text:#e8f4ff;--muted:#7fa3c4;--accent:#38bdf8;--accent2:#2dd4bf;--on:#021018;--done:#0a2a40;--glow:0 0 14px rgba(56,189,248,.5);--tex:rgba(56,189,248,.035)}
[data-theme=sunset]{--bg:#140a12;--card:#20111d;--line:#43203a;--text:#fff0f5;--muted:#b98aa5;--accent:#ff7a45;--accent2:#ff3d9a;--on:#1a0508;--done:#3a1424;--glow:0 0 14px rgba(255,122,69,.45);--tex:rgba(255,122,69,.03)}
[data-theme=violet]{--bg:#0d0816;--card:#17102a;--line:#34225a;--text:#f3eeff;--muted:#a392d1;--accent:#a855f7;--accent2:#ec4899;--on:#fff;--done:#2a1650;--glow:0 0 14px rgba(168,85,247,.55);--tex:rgba(168,85,247,.035)}
[data-theme=mint]{--bg:#06130f;--card:#0c1f19;--line:#1a3d32;--text:#e9fff7;--muted:#7fb5a2;--accent:#10e0a0;--accent2:#38bdf8;--on:#03140d;--done:#0c2e24;--glow:0 0 14px rgba(16,224,160,.45);--tex:rgba(16,224,160,.03)}
[data-theme=carbon]{--bg:#0a0a0a;--card:#141414;--line:#2c2c2c;--text:#fafafa;--muted:#8a8a8a;--accent:#fafafa;--accent2:#9ca3af;--on:#0a0a0a;--done:#212121;--glow:0 0 0 transparent;--tex:rgba(255,255,255,.025)}
[data-theme=royal]{--bg:#050a1a;--card:#0b1230;--line:#1d2a5c;--text:#eaf0ff;--muted:#8393c8;--accent:#3b82f6;--accent2:#a78bfa;--on:#fff;--done:#102050;--glow:0 0 14px rgba(59,130,246,.5);--tex:rgba(59,130,246,.035)}
[data-theme=hot]{--bg:#14060d;--card:#220c16;--line:#4a1a2f;--text:#fff0f6;--muted:#c08098;--accent:#ff2e88;--accent2:#ffb703;--on:#fff;--done:#3d1226;--glow:0 0 14px rgba(255,46,136,.5);--tex:rgba(255,46,136,.03)}
[data-theme=sky]{--bg:#eaf4fb;--card:#ffffff;--line:#cfe2f0;--text:#0b1b2b;--muted:#587790;--accent:#0ea5e9;--accent2:#6366f1;--on:#fff;--done:#d9eefb;--glow:0 0 0 transparent;--tex:rgba(14,165,233,.05)}
[data-theme=army]{--bg:#0c0f08;--card:#151a0e;--line:#2d3720;--text:#f0f3e6;--muted:#929c7e;--accent:#c9b037;--accent2:#7fa02e;--on:#141000;--done:#24290f;--glow:0 0 0 transparent;--tex:rgba(201,176,55,.035)}
.tc.on .ar::after{content:" ✓"}
/* player */
.mtitle{font-family:var(--head);font-style:italic;font-size:26px;line-height:1.2;color:var(--accent);text-shadow:var(--glow);margin:6px 0 14px;word-break:break-word;unicode-bidi:plain-text;text-align:right;min-height:62px}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px;margin-bottom:6px;direction:ltr;justify-content:flex-end}
.eq i{width:5px;background:linear-gradient(var(--accent2),var(--accent));border-radius:2px;height:20%}
.eq.on i{animation:eq .9s ease-in-out infinite}
.eq.on i:nth-child(2){animation-delay:-.3s}.eq.on i:nth-child(3){animation-delay:-.6s}.eq.on i:nth-child(4){animation-delay:-.15s}.eq.on i:nth-child(5){animation-delay:-.45s}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--line);outline:none;direction:ltr;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);box-shadow:var(--glow);border:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:0}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;direction:ltr;font-variant-numeric:tabular-nums}
.ctr{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 6px;direction:ltr}
.ctr button{border:1px solid var(--line);background:var(--bg);width:46px;height:46px;border-radius:50%;font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0}
.ctr button.main{width:68px;height:68px;font-size:26px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);box-shadow:var(--glow)}
.ctr button.on{border-color:var(--accent);color:var(--accent)}
.volrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:16px;direction:ltr}
.song{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;border-inline-start:4px solid var(--line);cursor:pointer}
.song.cur{border-color:var(--accent);border-inline-start-color:var(--accent);background:var(--done)}
.song .sn{flex:0 0 26px;font-family:var(--head);color:var(--muted);direction:ltr;text-align:center}
.song.cur .sn{color:var(--accent)}
.song .tt{flex:1;min-width:0;font-weight:600;font-size:14px;unicode-bidi:plain-text;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .x{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 8px;cursor:pointer}
.add{display:block;text-align:center}
.mini{position:fixed;inset:auto 10px calc(66px + env(safe-area-inset-bottom)) 10px;max-width:620px;margin:0 auto;background:var(--card);border:1px solid var(--accent);border-radius:14px;display:none;align-items:center;gap:6px;padding:8px 12px 10px;z-index:11;box-shadow:var(--glow);overflow:hidden}
.mini.show{display:flex}
.mini .tt{flex:1;min-width:0;font-size:13px;font-weight:700;unicode-bidi:plain-text;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.mini button{background:none;border:0;font-size:20px;padding:4px 8px;cursor:pointer}
.mini .pb{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line);direction:ltr}
.mini .pb i{display:block;height:100%;width:0;background:var(--accent)}
/* custom colours */
.cust{grid-column:1/-1;border:2px solid var(--line);border-radius:16px;padding:14px 12px;background:var(--card)}
.cust.on{border-color:var(--accent);box-shadow:var(--glow)}
.cust h3{margin:0 0 2px;font-family:var(--head);font-style:italic;letter-spacing:1px;color:var(--accent);font-size:24px;direction:ltr;text-align:right}
.cust small{color:var(--muted);font-size:12px}
.crow{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap}
.crow label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.crow input[type=color]{width:48px;height:38px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}

/* timer */
.tbtn{flex:0 0 38px;width:38px;height:38px;border-radius:10px;border:1px solid var(--accent2);background:transparent;color:var(--accent2);font-size:18px;padding:0;cursor:pointer;display:grid;place-items:center}
.tring{width:min(74vw,290px);aspect-ratio:1;margin:14px auto 10px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1%),var(--line) 0);display:grid;place-items:center;box-shadow:var(--glow)}
.tring>div{width:calc(100% - 24px);height:calc(100% - 24px);border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tring b{font-family:var(--head);font-size:clamp(54px,18vw,80px);line-height:1;direction:ltr;font-variant-numeric:tabular-nums;color:var(--text)}
.tring small{font-size:14px;color:var(--muted);min-height:20px;text-align:center;max-width:80%;unicode-bidi:plain-text}
.tring.prep{--accent:var(--accent2)}
.tring.fin{animation:tfin .5s ease-in-out 4}
@keyframes tfin{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;min-width:54px;direction:ltr;font-variant-numeric:tabular-nums}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.tctr{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0;direction:ltr}
.tctr button{border:1px solid var(--line);background:var(--card);width:56px;height:56px;border-radius:50%;font-size:15px;cursor:pointer;padding:0;font-weight:700}
.tctr button.go{width:92px;height:92px;font-size:34px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);box-shadow:var(--glow)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:8px;font-size:14px}
.trow .st{display:flex;align-items:center;gap:12px;direction:ltr}
.trow .st button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;cursor:pointer;padding:0}
.trow .st b{font-family:var(--head);font-size:24px;min-width:26px;text-align:center}
.tpill{position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;z-index:12;display:none;align-items:center;gap:6px;background:var(--card);color:var(--text);border:1px solid var(--accent);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--glow);direction:ltr;font-variant-numeric:tabular-nums}
.tpill.show{display:flex}
.pass .ctr{flex-wrap:nowrap;gap:5px}.pass .ctr button:not(.main){width:44px;height:44px;font-size:17px}
.sk-cassette .art{width:260px;height:150px;border-radius:14px;background:linear-gradient(135deg,#d9d3c3,#a89f8c);position:relative;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sk-cassette .art i{position:absolute;top:34px;width:58px;height:58px;border-radius:50%;background:repeating-conic-gradient(#222 0 30deg,#ddd 30deg 60deg);border:6px solid #222;box-sizing:border-box}
.sk-cassette .art i:nth-child(1){left:42px}.sk-cassette .art i:nth-child(2){right:42px}
.sk-cassette .art::after{content:"";position:absolute;left:34px;right:34px;bottom:14px;height:30px;border-radius:8px;background:#222}
.sk-cassette .art.spin i{animation:mspin 2s linear infinite}
.sk-cassette .eq,.sk-cassette small,.sk-dj .eq,.sk-dj small,.sk-glass small{display:none}
.sk-dj .art{display:flex;gap:16px;justify-content:center}
.sk-dj .art i{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0 16px,transparent 17px),repeating-radial-gradient(circle,#0b0b0b 0 3px,#1d1d1d 3px 5px);box-shadow:0 0 0 4px var(--accent)}
.sk-dj .art i:nth-child(2){box-shadow:0 0 0 4px var(--accent2)}

function weekKey(){ var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+1)%7)); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

function dayByKey(k){ return DAYS.filter(function(d){return d.key===k;})[0]; }

function id(day,si,i){ return day.key+"_"+si+"_"+i; }
function progress(day){
  if(day.rest) return [0,0];
  var t=0,d=0;
  day.sections.forEach(function(s,si){ s.items.forEach(function(_,i){ t++; if(checks[id(day,si,i)]) d++; }); });
  return [d,t];
}

}

  var bar=document.getElementById("tabbar"); bar.innerHTML="";
  tabOrder().map(function(id){ return [id].concat(TBL()[id]); }).forEach(function(t){

  });
}

["مش قادر تحرك الكتف حتى بمساعدة إيدك التانية (تيبّس واضح)؟‖Can't move the shoulder even with help from the other hand (clear stiffness)?",{fz:4}],
["الوجع فوق الكتف عند الترقوة وبيزيد في البنش أو الديبس؟‖Pain on top of the shoulder near the collarbone, worse in bench or dips?",{ac:3}],
["حاسس إن الكتف 'بيخرج' أو بيزحلق من مكانه؟‖Does the shoulder feel like it slips or goes 'out'?",{ins:4}],
["ضعف واضح في رفع الدراع؟‖Clear weakness lifting the arm?",{rc:3}],
["الوجع بيزيد بالليل لما تنام على الكتف؟‖Pain worse at night when lying on that shoulder?",{imp:1,rc:1,fz:1}]],
c:{imp:["احتكاك أوتار الكتف (Impingement)‖Shoulder impingement","الأوتار بتتحك تحت عظمة الكتف خصوصًا مع الضغط فوق الراس والرفرفة الجانبية، وغالبًا مع ضعف عضلات تثبيت لوح الكتف.‖Tendons rub under the shoulder bone, mostly with overhead pressing and lateral raises, often with weak scapular stabilizers.",4,12,["قلّل أو أوقف الضغط فوق الراس والـUpright Row مؤقتًا‖Reduce or pause overhead presses and upright rows for now","اشتغل Band External Rotation وFace Pull وWall Slides بوزن خفيف وبدون ألم‖Do band external rotations, face pulls and wall slides light and pain-free","إطالة Sleeper Stretch وDoorway Chest Stretch يوميًا‖Daily sleeper and doorway chest stretches","ارجع للأوزان تدريجيًا (+10% كل أسبوع) لما الوجع يبقى أقل من 3/10‖Return gradually (+10%/week) once pain is below 3/10"],"الرفع الجانبي فوق مستوى الكتف والتمارين خلف الرقبة‖Lateral raises above shoulder height and behind-the-neck work",1],
rc:["شد أو تمزق في الكفة المدورة‖Rotator cuff strain/tear","وجع وضعف في رفع الدراع أو لفّه، وممكن يكون شد بسيط أو تمزق جزئي/كلي.‖Pain and weakness lifting or rotating the arm; can be a mild strain or a partial/full tear.",6,16,["راحة نسبية من الرفع فوق الراس والأوزان التقيلة‖Relative rest from overhead and heavy lifting","حركات خفيفة بدون ألم (Pendulum Swing، Isometric External Rotation Hold)‖Gentle pain-free motion (pendulum swings, isometric external rotation holds)","تقوية تدريجية بالأستك بعد ما الوجع يهدى‖Gradual band strengthening once pain settles","لو ضعف واضح أو بعد سقطة: لازم فحص وأشعة/رنين‖If clear weakness or after a fall: needs an exam and imaging"],"الأوزان التقيلة والضغط فوق الراس والديبس‖Heavy loads, overhead press and dips",2],
fz:["الكتف المتجمد (التهاب المحفظة اللاصق)‖Frozen shoulder (adhesive capsulitis)","تيبّس تدريجي في الكتف مع وجع بالليل، وحركة الكتف بتقل حتى بمساعدة اليد التانية. بياخد وقت طويل.‖Gradual stiffness with night pain; motion is limited even with the other hand's help. Takes a long time.",26,104,["إطالات لطيفة يوميًا (Table Slide Stretch، Finger Wall Walk) بعد دفا الكتف‖Gentle daily stretches (table slides, finger wall walks) after warming the shoulder","كمادات دافية قبل التمارين‖Warm compresses before exercises","علاج طبيعي بإشراف أخصائي‖Physiotherapy under a specialist","ما تجبرش الحركة بعنف‖Never force the movement"],"التمدد العنيف والأوزان فوق الراس‖Aggressive stretching and overhead loads",2],
ac:["شد عضلي أو التهاب المفصل الأخرمي الترقوي‖Muscle strain / AC joint irritation","وجع موضعي فوق الكتف بعد الضغط التقيل، غالبًا بيتحسن بالراحة وتعديل التمارين.‖Local pain on top of the shoulder after heavy pressing; usually settles with rest and exercise modification.",2,6,["قلّل البنش والديبس واستبدلها بتمارين بدون ألم‖Cut back bench and dips; swap in pain-free alternatives","كمادات تلج 10–15 دقيقة أول يومين لو في ورم‖Ice 10–15 min for the first 2 days if swollen","ارجع تدريجيًا بوزن أخف ومدى أصغر‖Return gradually with lighter weight and a shorter range"],"الديبس العميق والبنش بقبضة واسعة‖Deep dips and wide-grip bench",1],
ins:["عدم ثبات الكتف / خلع جزئي‖Shoulder instability","إحساس إن الكتف بيخرج أو يزحلق، وغالبًا بعد خلع أو إصابة سابقة.‖A sense of the shoulder slipping or going out, usually after a dislocation or earlier injury.",8,24,["ثبّت الكتف (حمّالة) لو الدكتور طلب ذلك‖Use a sling only if your doctor says so","تقوية ثبات لوح الكتف وCuff بعد الفحص‖Scapular and cuff stabilisation after an exam","تجنب الوضعيات اللي بتخلّي الكتف يخرج‖Avoid positions that make it slip"],"الرفع فوق الراس والحركات المفرودة للخلف‖Overhead and extreme end-range positions",2]}},
knee:{n:"ركبة‖Knee",q:[
["الوجع بدأ بعد لفّة أو التواء وحسيت أو سمعت 'طَقّة'؟‖Did it start after a twist, with a pop?",{lig:3,men:2}],
["ورم سريع في الركبة خلال ساعات؟‖Quick swelling within hours?",{lig:3,men:1}],
["الركبة بتقفل أو بتتعلق أو مش بتتفرد؟‖Does the knee lock, catch or not fully straighten?",{men:4}],
["وجع قدّام الركبة حوالين الرضفة مع السلم أو السكوات؟‖Pain around the kneecap with stairs or squats?",{pf:3}],
["وجع تحت الرضفة مباشرة مع القفز أو الجري؟‖Pain just below the kneecap with jumping or running?",{pt:4}]],
c:{pf:["وجع الرضفة (ركبة العدّاء)‖Patellofemoral pain","وجع حوالين الرضفة بيزيد مع السلم والسكوات العميق، غالبًا من ضعف عضلات الفخذ والورك.‖Pain around the kneecap, worse with stairs and deep squats; often from weak quads and hips.",4,8,["قلّل السكوات العميق والقفز مؤقتًا‖Reduce deep squats and jumping for now","قوّي الكواد والجلوتس (Wall Sit، Glute Bridge، Step-Up بوزن خفيف)‖Strengthen quads and glutes (wall sit, glute bridge, light step-ups)","إطالة الكواد والهامسترنج والسمانة‖Stretch quads, hamstrings and calves"],"النزول العميق تحت الوجع‖Squatting deeper than the pain-free range",0],
pt:["التهاب وتر الرضفة‖Patellar tendinopathy","الوتر تحت الرضفة بيتعب من القفز والأحمال المتكررة.‖The tendon below the kneecap is overloaded by jumping and repeated loading.",6,12,["قلّل القفز والجري السريع‖Reduce jumping and fast running","تمارين Isometric للكواد (Wall Sit) 30–45 ثانية‖Isometric quad holds (wall sit) 30–45 s","زوّد الحمل تدريجيًا بعد ما الوجع يهدى‖Reload gradually once pain settles"],"القفز المتكرر‖Repeated jumping",1],
lig:["التواء أو قطع رباط الركبة‖Knee ligament sprain/tear","غالبًا بعد لفّة، مع ورم سريع وإحساس بعدم ثبات.‖Usually after a twist, with fast swelling and a feeling of instability.",3,16,["راحة وتلج ورفع الرجل والضغط الخفيف‖Rest, ice, elevation and light compression","ما تحمّلش وزن لو وجعك شديد‖Don't load it if pain is severe","لازم فحص عشان تحديد درجة الإصابة‖You need an exam to grade the injury"],"اللف والقفز والرياضات اللي فيها تغيير اتجاه‖Twisting, jumping and cutting sports",2],
men:["إصابة غضروف الركبة (Meniscus)‖Meniscus injury","وجع مع لفّة، وممكن قفل أو تعليق في الركبة.‖Pain after a twist, possibly with locking or catching.",6,12,["راحة وتجنب اللف والسكوات العميق‖Rest and avoid twisting and deep squats","علاج طبيعي بعد الفحص‖Physiotherapy after an exam","لو في قفل: لازم دكتور بسرعة‖If it locks: see a doctor soon"],"السكوات العميق واللف تحت حمل‖Deep squats and loaded twisting",2]}},
back:{n:"أسفل الضهر‖Lower back",q:[
["الوجع نازل في رجلك أو معاه تنميل؟‖Pain radiating down the leg, or tingling?",{disc:4}],
["بدأ بعد رفعة تقيلة أو حركة مفاجئة والوجع في العضل؟‖Started after a heavy lift or sudden move, felt in the muscles?",{str:3}],
["الوجع بيزيد لما تنحني لقدّام أو تقعد كتير؟‖Worse bending forward or sitting long?",{disc:2}],
["تيبّس الصبح بيخف مع الحركة؟‖Morning stiffness that eases with movement?",{fac:3,str:1}],
["الوجع بيزيد لما تتحني لورا؟‖Worse leaning backward?",{fac:3}]],
c:{str:["شد عضلي في أسفل الضهر‖Lower back muscle strain","شد أو إجهاد في عضلات الضهر، وبيتحسن غالبًا خلال أسابيع.‖A strain of the back muscles that usually improves within weeks.",1,6,["ابقى متحرك: مشي خفيف أفضل من الراحة الكاملة‖Keep moving: light walking beats complete bed rest","دفا موضعي وإطالات لطيفة (Cat-Cow، Child's Pose)‖Local heat and gentle stretches (cat-cow, child's pose)","ارجع للديدلفت والسكوات بوزن خفيف جدًا وتدريجيًا‖Return to deadlifts and squats very light and gradual"],"الديدلفت التقيل والانحناء المحمّل‖Heavy deadlifts and loaded bending",0],
disc:["انزلاق غضروفي أو ضغط على عصب‖Disc irritation / nerve compression","وجع بينزل للرجل أو تنميل، ويحتاج تقييم طبي.‖Pain radiating into the leg or tingling; needs a medical assessment.",6,12,["راحة نسبية وتجنب الانحناء المحمّل‖Relative rest and avoid loaded bending","مشي خفيف وتمارين ثبات الكور بعد إذن الدكتور‖Light walking and core stability after your doctor agrees","لو ضعف في الرجل أو صعوبة في التحكم بالبول/البراز: طوارئ فورًا‖If leg weakness or loss of bladder/bowel control: emergency now"],"الديدلفت التقيل والجلوس الطويل‖Heavy deadlifts and long sitting",2],
fac:["تيبّس أو التهاب مفاصل الضهر الصغيرة‖Facet joint irritation / stiffness","وجع بيزيد مع التقوّس لورا وتيبّس الصبح.‖Pain with arching backward and morning stiffness.",2,8,["حركة لطيفة ودفا‖Gentle movement and heat","تقوية الكور والجلوتس‖Strengthen core and glutes","تجنب التقوّس الزايد (Overhead المحمّل)‖Avoid excessive arching (loaded overhead work)"],"التقوّس الزايد تحت حمل‖Loaded hyperextension",1]}},
elbow:{n:"كوع‖Elbow",q:[
["الوجع في الجنب الخارجي للكوع ويزيد مع المسكة أو شد الرسغ لورا؟‖Outer-elbow pain, worse with gripping or extending the wrist?",{te:4}],
["الوجع في الجنب الداخلي ويزيد مع الكيرلز أو المسكة؟‖Inner-elbow pain, worse with curls or gripping?",{ge:4}],
["الوجع ورا الكوع مع الدفع (تراي/ضغط)؟‖Pain behind the elbow with pushing (triceps/press)?",{tt:4}]],
c:{te:["تينس إلبو (التهاب وتر خارجي)‖Tennis elbow","وتر الساعد الخارجي متعب من المسكة المتكررة.‖The outer forearm tendon is overloaded by repeated gripping.",8,26,["قلّل المسك والسحب الكتير مؤقتًا واستخدم Straps‖Reduce heavy gripping/pulling for now and use straps","تمارين Isometric وEccentric للرسغ (Reverse Wrist Curl خفيف)‖Isometric and eccentric wrist work (light reverse wrist curl)","إطالة عضلات الساعد‖Forearm stretches"],"السحب التقيل بمسكة قوية‖Heavy pulling with a hard grip",1],
ge:["جولفر إلبو (التهاب وتر داخلي)‖Golfer's elbow","وتر الساعد الداخلي متعب من الكيرلز والمسكة.‖The inner forearm tendon is overloaded by curls and gripping.",6,16,["قلّل الكيرلز والسحب مؤقتًا‖Reduce curls and pulling for now","Wrist Curl خفيف وإطالة الساعد‖Light wrist curls and forearm stretching","زوّد الحمل تدريجيًا‖Reload gradually"],"الكيرلز التقيل‖Heavy curls",1],
tt:["التهاب وتر التراي‖Triceps tendinopathy","وجع ورا الكوع من الدفع والتراي المتكرر.‖Pain behind the elbow from repeated pressing and triceps work.",4,12,["قلّل الدفع والديبس مؤقتًا‖Reduce pressing and dips for now","Isometric خفيف للتراي‖Light isometric triceps work","إطالة التراي بدون ألم‖Pain-free triceps stretch"],"الديبس والسكَل كراشر التقيل‖Dips and heavy skull crushers",1]}},
wrist:{n:"رسغ / إيد‖Wrist / hand",q:[
["وجع في الرسغ لما تحمّل وزن عليه (ضغط/بنش)؟‖Wrist pain when bearing weight (push-ups/bench)?",{ws:3}],
["تنميل أو وخز في الصوابع خصوصًا بالليل؟‖Tingling or numbness in the fingers, especially at night?",{cts:4}],
["وجع في ناحية الإبهام مع المسك؟‖Pain on the thumb side with gripping?",{tn:3}]],
c:{ws:["شد أو إجهاد الرسغ‖Wrist strain","إجهاد بسيط من الحمل على الرسغ.‖Mild overload from loading the wrist.",1,6,["استخدم Wrist Wraps أو وضعية قبضة اليد في الضغط‖Use wraps or fist/handle position for pressing","إطالات وتقوية خفيفة للساعد‖Light forearm stretching and strengthening","قلّل الأحمال اللي بتضغط على الرسغ‖Reduce wrist-loading work"],"البنش والضغط على كف مفرود لو بيوجع‖Flat-hand pressing if painful",0],
cts:["أعراض النفق الرسغي‖Carpal tunnel symptoms","ضغط على العصب الأوسط بيسبب وخز وتنميل.‖Pressure on the median nerve causes tingling and numbness.",6,12,["جبيرة ليلية للرسغ في وضع محايد‖Night wrist splint in neutral position","قلّل الحركات المتكررة‖Reduce repetitive wrist movements","لازم تقييم طبي لو التنميل مستمر‖See a doctor if numbness persists"],"الكتابة والمسك الطويل‖Long gripping and typing",2],
tn:["التهاب أوتار الإبهام (دي كيرفان)‖De Quervain's tenosynovitis","وجع ناحية الإبهام مع المسك والإمساك.‖Thumb-side pain with gripping.",4,10,["راحة نسبية للإبهام ودفا خفيف‖Relative rest and light warmth","جبيرة إبهام لو ساعدت‖Thumb splint if it helps","روح أخصائي لو ما اتحسنش‖See a specialist if no improvement"],"المسك القوي بالإبهام‖Strong thumb gripping",1]}},
neck:{n:"رقبة‖Neck",q:[
["الوجع بدأ بعد نوم غلط أو وضعية طويلة وبيخف مع الحركة؟‖Began after poor sleep or long posture and eases with movement?",{ns:4}],
["وجع أو تنميل بينزل للدراع أو الصوابع؟‖Pain or tingling running into the arm or fingers?",{nr:5}],
["شد في الترابيس مع صداع من ورا الرقبة؟‖Tight traps with a headache from the back of the neck?",{nt:3,ns:1}]],
c:{ns:["شد عضلي أو رقبة متيبّسة‖Neck muscle strain / stiff neck","بيتحسن غالبًا خلال أيام لأسابيع.‖Usually improves within days to weeks.",1,3,["دفا وإطالات لطيفة (Neck Side Stretch)‖Heat and gentle neck stretches","حافظ على وضعية جلوس ونوم مريحة‖Keep a comfortable sitting and sleeping posture","قلّل الشراج الكتير والأوزان فوق الراس مؤقتًا‖Reduce heavy shrugs and overhead loads"],"الأوزان على الرقبة والحركات العنيفة‖Loading the neck and jerky moves",0],
nr:["ضغط على عصب الرقبة‖Cervical nerve irritation","وجع أو تنميل بينزل للدراع، يحتاج تقييم طبي.‖Pain or tingling into the arm needs a medical assessment.",4,12,["تجنب الأوزان فوق الراس‖Avoid overhead loading","وضعية جلوس مظبوطة‖Good posture","لازم تروح دكتور‖See a doctor"],"الضغط على الرقبة‖Neck compression",2],
nt:["شد الترابيس وصداع الرقبة‖Trap tension / neck headache","شد في عضلات الرقبة والكتف العلوية.‖Tension in the neck and upper shoulder muscles.",2,6,["Upper Trap Stretch وشد الرقبة لطيف‖Upper trap and gentle neck stretches","فوم رولر للضهر العلوي‖Foam roll the upper back","نوم كفاية وماية‖Enough sleep and water"],"الشراج التقيل‖Heavy shrugs",0]}},
hip:{n:"ورك‖Hip",q:[
["وجع في الفخد الأمامي أو الأربية مع رفع الركبة؟‖Front-of-thigh/groin pain when lifting the knee?",{hf:3}],
["وجع في المؤخرة مع الجلوس أو نازل للرجل؟‖Buttock pain with sitting or radiating down the leg?",{pir:3}],
["وجع في الأربية مع لف الورك أو سكوات عميق؟‖Groin pain with hip rotation or a deep squat?",{fai:4}]],
c:{hf:["شد عضلة الورك الأمامية‖Hip flexor strain","إجهاد في عضلة رفع الركبة.‖Overload of the hip flexor.",2,6,["راحة نسبية من الجري وLeg Raise‖Rest from running and leg raises","Kneeling Hip Flexor Stretch لطيف‖Gentle kneeling hip flexor stretch","تقوية تدريجية بعد ما الوجع يهدى‖Gradual strengthening once pain settles"],"الجري السريع ورفع الرجل المحمّل‖Fast running and loaded leg raises",0],
pir:["شد العضلة الكمثرية أو تهيّج عصب وركي‖Piriformis / sciatic irritation","وجع في المؤخرة ممكن ينزل للفخد.‖Buttock pain that may travel down the thigh.",3,8,["Figure-Four Stretch وPigeon Pose‖Figure-four and pigeon stretches","كور وجلوتس خفيف‖Light core and glute work","لو تنميل مستمر: دكتور‖If numbness persists: doctor"],"الجلوس الطويل‖Long sitting",1],
fai:["احتكاك مفصل الورك (FAI)‖Hip impingement (FAI)","احتكاك في مقدمة المفصل مع السكوات العميق واللف.‖Pinching at the front of the joint with deep squats and rotation.",8,16,["قلّل السكوات العميق جدًا‖Avoid very deep squats","تقوية الجلوتس والكور‖Strengthen glutes and core","يفضل تقييم أخصائي‖A specialist assessment is advisable"],"أقصى عمق في السكوات‖Maximum squat depth",1]}},
ankle:{n:"كاحل / قدم‖Ankle / foot",q:[

["وجع ورا الكعب في وتر أخيل خصوصًا الصبح؟‖Pain behind the heel (Achilles), especially mornings?",{at:4}],
["وجع في باطن الكعب أول خطوات الصبح؟‖Heel pain with the first steps in the morning?",{pf2:5}]],
c:{sp:["التواء الكاحل‖Ankle sprain","شد أو قطع جزئي في أربطة الكاحل بعد لفّة.‖Stretch or partial tear of the ankle ligaments after a roll.",2,6,["راحة وتلج ورفع القدم أول 48 ساعة‖Rest, ice and elevate for the first 48 hours","حركة لطيفة مبكرًا (Ankle Alphabet) وبعدين Band Ankle Inversion/Eversion‖Early gentle motion (ankle alphabet), then band inversion/eversion","توازن على رجل واحدة قبل الرجوع للجري‖Single-leg balance before returning to running"],"الجري والقفز لحد ما يخف‖Running and jumping until it settles",1],
at:["التهاب وتر أخيل‖Achilles tendinopathy","وجع ورا الكعب من الحمل المتكرر.‖Pain behind the heel from repeated loading.",6,12,["قلّل الجري والقفز مؤقتًا‖Reduce running and jumping for now","Calf Raise بطيء (تقوية Eccentric)‖Slow calf raises (eccentric loading)","رفع الكعب بنعل مناسب‖A heel lift or suitable shoes"],"الجري على طلعات والقفز‖Hill running and jumping",1],
pf2:["التهاب اللفافة الأخمصية‖Plantar fasciitis","وجع باطن الكعب أول خطوات الصبح.‖Heel-bottom pain with the first steps.",6,16,["إطالة السمانة والقدم‖Stretch calves and plantar fascia","كورة تدليك تحت القدم‖Roll a ball under the foot","جزمة بدعم مناسب‖Supportive shoes"],"المشي حافي والجري الكتير‖Barefoot walking and heavy running",1]}}

function removeSong(i){

function addFiles(list,gf){
  var all=Array.prototype.slice.call(list||[]);
  /* بعض موبايلات الأندرويد بترجّع الملف من غير نوع أو من غير امتداد، فمش بنفلتر بالامتداد؛ بس بنستبعد الصور والنصوص */
  var files=all.filter(function(f){ return !/^(image|text)\//.test(f.type||""); });
  if(!files.length){ if(all.length) alert("الملفات اللي اخترتها مش أغاني."); return; }
  var left=files.length;
  function one(){ left--; if(left<=0){ sset("gym_pl",PL); updateUI(); if(view==="music"){ var br=document.querySelector(".brand span"); if(br) br.textContent=tr(songs.length+" أغنية"); } } }
  files.forEach(function(f,k){
    var nm=(f.name||("أغنية "+(songs.length+k+1))).replace(/\.[^.]+$/,"");
    var ex=songs.filter(function(q){ return q.name===nm&&q.blob&&q.blob.size===f.size; })[0], gn=gf?gf(f):null;
    if(ex){ if(gn){ PL[gn]=PL[gn]||[]; if(PL[gn].indexOf(ex.added)<0) PL[gn].push(ex.added); } one(); return; }
    var rec={name:nm,blob:f,added:Date.now()+k};
    if(gn){ PL[gn]=PL[gn]||[]; PL[gn].push(rec.added); }
    function mem(){ rec.id=null; songs.push(rec); one(); }
    if(DB&&!memMode){
      var done=false;
      try{
        var tx=DB.transaction("songs","readwrite"), rq=tx.objectStore("songs").add(rec);
        rq.onsuccess=function(){ if(done) return; done=true; rec.id=rq.result; songs.push(rec); one(); };
        rq.onerror=function(){ if(done) return; done=true; memMode=true; mem(); };
        tx.onabort=function(){ if(done) return; done=true; memMode=true; mem(); };
      }catch(e){ if(!done){ done=true; memMode=true; mem(); } }
    } else mem();
  });
}

/* ===== TIMER (offline: timestamps + WebAudio + vibrate + wake lock) ===== */
var TM={mode:"down",total:sget("gym_tm_total")||60,phase:"idle",running:false,endAt:0,startAt:0,base:0,workMs:0,sets:0,label:"",
  prep:sget("gym_tm_prep")!==false,ps:sget("gym_tm_ps")||5,sound:sget("gym_tm_snd")!==false,lastBeep:-1,iv:null,lock:null,fin:false};
TM.workMs=TM.total*1000;
var AC=null;
function tmUnlock(){ try{ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); } if(AC&&AC.state==="suspended") AC.resume(); }catch(e){} }
function tmBeep(f,d,vol){
  if(!TM.sound||!AC) return;
  try{ var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.5,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.05); }catch(e){}
}
function tmBuzz(p){ if(TM.sound){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} } }
function tmFinishSound(){ tmBeep(880,.25); setTimeout(function(){ tmBeep(988,.25); },300); setTimeout(function(){ tmBeep(1175,.6,.6); },600); tmBuzz([300,120,300,120,600]); }
function tmLockOn(){ try{ if(navigator.wakeLock&&!TM.lock){ navigator.wakeLock.request("screen").then(function(l){ TM.lock=l; l.addEventListener("release",function(){ TM.lock=null; }); }).catch(function(){}); } }catch(e){} }
function tmLockOff(){ try{ if(TM.lock){ TM.lock.release(); TM.lock=null; } }catch(e){} }
document.addEventListener("visibilitychange",function(){ if(!document.hidden&&TM.running){ tmLockOn(); tmTick(); } });
function tmFmt(ms,up){ var sec=up?Math.floor(ms/1000):Math.ceil(ms/1000); if(sec<0)sec=0; var m=Math.floor(sec/60),s=sec%60; return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
function tmMs(){
  var now=Date.now();
  if(TM.mode==="up") return TM.base+(TM.running?now-TM.startAt:0);
  if(TM.running) return Math.max(0,TM.endAt-now);
  return TM.workMs;
}
function tmActive(){ return TM.running || (TM.mode==="up"?TM.base>0:TM.workMs<TM.total*1000); }
function tmStart(){
  tmUnlock(); if(TM.running) return;
  var now=Date.now(); TM.fin=false; TM.lastBeep=-1;
  if(TM.mode==="up"){ TM.phase="work"; TM.startAt=now; }
  else{
    if(TM.workMs<=0) TM.workMs=TM.total*1000;
    if(TM.prep && TM.workMs===TM.total*1000){ TM.phase="prep"; TM.endAt=now+TM.ps*1000; }
    else{ TM.phase="work"; TM.endAt=now+TM.workMs; }
  }
  TM.running=true; tmLockOn();
  clearInterval(TM.iv); TM.iv=setInterval(tmTick,200);
  tmUI();
}
function tmPause(){
  if(!TM.running) return; var now=Date.now();
  if(TM.mode==="up") TM.base+=now-TM.startAt;
  else if(TM.phase==="work") TM.workMs=Math.max(0,TM.endAt-now);
  TM.running=false; TM.phase="idle"; clearInterval(TM.iv); tmLockOff(); tmUI();
}
function tmReset(){
  TM.running=false; TM.phase="idle"; TM.base=0; TM.workMs=TM.total*1000; TM.fin=false;
  clearInterval(TM.iv); tmLockOff(); tmUI();
}
function tmTick(){
  if(!TM.running) return;
  var now=Date.now();
  if(TM.mode==="down"){
    var left=TM.endAt-now, sec=Math.ceil(left/1000);
    if(left>0){ if(sec<=3 && sec!==TM.lastBeep){ TM.lastBeep=sec; tmBeep(TM.phase==="prep"?660:800,.15); tmBuzz(60); } }
    else if(TM.phase==="prep"){ tmBeep(1100,.4,.6); tmBuzz(200); TM.phase="work"; TM.lastBeep=-1; TM.endAt=now+TM.workMs; }
    else{
      TM.running=false; TM.phase="idle"; TM.workMs=TM.total*1000; TM.fin=true; clearInterval(TM.iv); tmLockOff(); tmFinishSound();
      setTimeout(function(){ TM.fin=false; tmUI(); },2200);
    }
  }
  tmUI();
}
function tmSetTotal(sec){
  sec=Math.max(1,Math.min(5999,sec)); TM.total=sec; sset("gym_tm_total",sec);
  if(!TM.running){ TM.workMs=sec*1000; TM.phase="idle"; } tmUI(); tmChips();

  for(var i=0;i<bs.length;i++) bs[i].classList.toggle("on",+bs[i].getAttribute("data-ts")===TM.total);

function tmUI(){
  var ms=tmMs(), up=TM.mode==="up";
  var t=$("tmTime"), r=$("tmRing"), ph=$("tmPhase"), go=$("tmGo");
  if(t) t.textContent=tmFmt(TM.phase==="prep"?TM.endAt-Date.now():ms, up&&TM.phase!=="prep");
  if(r){
    var p=up?((ms/1000)%60)/60*100:(TM.phase==="prep"?(1-(TM.endAt-Date.now())/(TM.ps*1000))*100:(1-ms/(TM.total*1000))*100);
    r.style.setProperty("--p",Math.max(0,Math.min(100,p)));

}

var NAV=(function(){ var o=sget("gym_nav"); if(!o||Date.now()-(o.t||0)>72e5) o={}; o.sc=o.sc||{}; return o; })();

function navStore(){ NAV.t=Date.now(); sset("gym_nav",NAV); }
function navBefore(){
  navRest=false;
  if(_pv!==null) NAV.sc[navKey(_pv,_ps)]=window.pageYOffset||0;
  if(_pv==="set"&&view!=="set") NAV.sub=navDrop?null:(_ps||null);
  else if(view==="set"&&sub===null&&_pv!=="set"&&NAV.sub){ sub=NAV.sub; }
  if(_pv!==null&&_pv!==view) navRest=true;
  navDrop=0;
  if(view==="set") NAV.sub=sub;
}
function navAfter(){
  if(navRest){ var y=NAV.sc[navKey(view,sub)]||0; setTimeout(function(){ window.scrollTo(0,y); },0); setTimeout(function(){ window.scrollTo(0,y); },120); }
  _pv=view; _ps=sub; navStore();
}

  if(GX){ GX(); GX=null; } if(view==="card"){ view="set"; sub="card"; }

  applyTheme();

  renderTabbar();
  updateUI(); updateTime(); tmUI();
  navAfter();
}
